name: Build HGhub Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hghub-android-arm64
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout upstream HGhub v1.2.1
        uses: actions/checkout@v4
        with:
          repository: Minireel/HGhub
          ref: v1.2.1
          path: source

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        working-directory: source
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target
          key: android-arm64

      - name: Install JavaScript dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        working-directory: source
        run: pnpm tauri android init --ci

      - name: Build ARM64 APK
        working-directory: source
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign APK for installation
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p artifacts
          KEYSTORE="$RUNNER_TEMP/hghub-build.keystore"
          STORE_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias hghub-build \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HGhub Android Build"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias hghub-build \
              --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" \
              --v4-signing-enabled false --out artifacts/HGhub_v1.2.1_arm64.apk "$APK"
          done
          "$APKSIGNER" verify --verbose artifacts/HGhub_v1.2.1_arm64.apk
          ls -lh artifacts
          rm -f "$KEYSTORE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-v1.2.1-Android-ARM64
          path: source/artifacts/HGhub_v1.2.1_arm64.apk
          if-no-files-found: error
          retention-days: 14
